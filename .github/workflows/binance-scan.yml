
name: Binance Public Data Endpoint Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-endpoint:
    name: Test Binance Public Market Data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test Binance public data endpoints
        run: |
          for endpoint in \
            "https://data-api.binance.vision/api/v3/exchangeInfo?symbol=BTCUSDT" \
            "https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT" \
            "https://data-api.binance.vision/api/v3/ticker/bookTicker?symbol=BTCUSDT"
          do
            echo ""
            echo "Testing: $endpoint"

            response_file="$(mktemp)"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 2 \
              --connect-timeout 15 \
              --max-time 30 \
              "$endpoint" \
              --output "$response_file"

            python -c \
              'import json,sys; json.load(open(sys.argv[1])); print("SUCCESS: Valid JSON received.")' \
              "$response_file"

            rm "$response_file"
          done

          echo ""
          echo "All Binance public data endpoint tests passed."
