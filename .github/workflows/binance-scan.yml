
name: Binance Spot Market Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan Binance Spot Markets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Scan Binance Spot markets
        run: |
          grid-scanner \
            --exchanges binance \
            --limit 10 \
            --csv reports/binance-spot-scan.csv

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: binance-spot-scan
          path: reports/binance-spot-scan.csv
          if-no-files-found: error
          retention-days: 7
