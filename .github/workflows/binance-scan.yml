
name: Binance Spot Grid Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: Run Binance Grid Research
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Binance Spot Grid research
        run: |
          grid-scanner \
            --limit 10 \
            --min-volume 5000000 \
            --max-spread 0.15 \
            --candle-limit 500 \
            --csv reports/binance-grid-research.csv

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: binance-grid-research
          path: reports/binance-grid-research.csv
          if-no-files-found: error
          retention-days: 7
