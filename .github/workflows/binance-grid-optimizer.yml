
name: Binance Spot Grid Optimizer

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated Binance USDT pairs, e.g. BTC/USDT ETH/USDT"
        required: true
        default: "BTC/USDT ETH/USDT"
        type: string
      interval:
        description: "Historical candle timeframe"
        required: true
        default: "1h"
        type: choice
        options:
          - "1h"
          - "4h"
          - "1d"
      candles:
        description: "Number of historical candles (2-1000)"
        required: true
        default: "500"
        type: string
      capital:
        description: "Starting capital in USDT per pair"
        required: true
        default: "500"
        type: string
      widths:
        description: "Total grid range widths, comma-separated percentages"
        required: true
        default: "10,20,30"
        type: string
      grids:
        description: "Grid interval counts, comma-separated"
        required: true
        default: "5,10,15,20"
        type: string
      modes:
        description: "Grid modes, comma-separated"
        required: true
        default: "arithmetic,geometric"
        type: string
      fee:
        description: "Trading fee percentage per fill"
        required: true
        default: "0.1"
        type: string
      slippage:
        description: "Slippage percentage per fill"
        required: true
        default: "0.05"
        type: string

permissions:
  contents: read

jobs:
  optimize:
    name: Optimize Binance Spot Grid Configurations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SYMBOLS: ${{ inputs.symbols }}
      INTERVAL: ${{ inputs.interval }}
      CANDLES: ${{ inputs.candles }}
      CAPITAL: ${{ inputs.capital }}
      WIDTHS: ${{ inputs.widths }}
      GRIDS: ${{ inputs.grids }}
      MODES: ${{ inputs.modes }}
      FEE: ${{ inputs.fee }}
      SLIPPAGE: ${{ inputs.slippage }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run Binance Grid Optimizer
        run: |
          read -r -a SYMBOL_ARRAY <<< "$SYMBOLS"

          if [ "${#SYMBOL_ARRAY[@]}" -eq 0 ]; then
            echo "At least one symbol is required."
            exit 1
          fi

          grid-binance-optimizer "${SYMBOL_ARRAY[@]}" \
            --interval "$INTERVAL" \
            --candles "$CANDLES" \
            --capital "$CAPITAL" \
            --widths "$WIDTHS" \
            --grids "$GRIDS" \
            --modes "$MODES" \
            --fee "$FEE" \
            --slippage "$SLIPPAGE" \
            --output reports/binance-grid-optimizer.csv

      - name: Upload optimizer report
        uses: actions/upload-artifact@v4
        with:
          name: binance-grid-optimizer
          path: reports/binance-grid-optimizer.csv
          if-no-files-found: error
          retention-days: 30
