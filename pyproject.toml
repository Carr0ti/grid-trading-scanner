
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-trading-scanner"
version = "0.1.0"
description = "Free multi-exchange Spot Grid research scanner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grid-scanner = "grid_scanner.cli:main"
grid-backtest = "grid_scanner.backtest_cli:main"
grid-parameter-sweep = "grid_scanner.parameter_sweep_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
